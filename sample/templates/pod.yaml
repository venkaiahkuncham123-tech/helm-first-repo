apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-pod
  labels:
    app: {{ .Release.Name }}
spec:
  containers:
    - name: nginx
      image: {{ .Values.image.name }}
      ports:
        - containerPort: {{ .Values.port }}
      livenessProbe:
        httpGet:
          path: /
          port: {{ .Values.livenessprobe.port }}
        initialDelaySeconds: 20
        periodSeconds: 30
        failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: front-end
      port: 80
      targetPort: {{ .Values.port }}
      protocol: "TCP"
        
